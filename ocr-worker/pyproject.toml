[project]
name = "skn30-contract-ocr-worker"
version = "0.1.0"
description = "PaddleOCR-VL-1.6 local contract OCR and masking worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "pymupdf>=1.24",
    "paddlepaddle>=3.2.1",
    "paddleocr[doc-parser]>=3.6.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
