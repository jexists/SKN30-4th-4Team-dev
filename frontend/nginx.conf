server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite 가 파일명에 해시를 붙이므로 내용이 바뀌면 경로도 바뀐다 — 길게 캐시해도 안전하다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA 라우팅 — 모든 경로를 index.html 로 (새로고침/직접진입 대응)
  location / {
    # index.html 이 캐시되면 재배포해도 사용자가 이전 번들을 계속 받는다.
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
