[project]
name = "skn30-4th-backend"
version = "0.1.0"
description = "SKN30-4th-4Team 전·월세 분쟁 팩트체커 백엔드 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "sentence-transformers>=5.6.0",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# 색인(ingest) 보조 그룹 — 임베딩 모델(KURE-v1)은 API 런타임에도 포함된다.
# openai/numpy 는 임베딩 비교 노트북(tests/chunks)에서도 사용한다.
# 설치:  uv sync --group ingest
ingest = [
    "sentence-transformers>=3.0",
    "openai>=1.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

# 애플리케이션(라이브러리 아님) — uv 가 루트를 빌드/설치하지 않도록 설정
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
