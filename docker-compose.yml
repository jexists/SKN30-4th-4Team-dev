# 선택 실행 경로 — 평소 개발은 uv/npm 직접 실행이 더 빠릅니다.
# 환경 통일·온보딩·배포용으로 `docker compose up --build` 사용.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      OCR_WORKER_URL: http://ocr-worker:8100
    volumes:
      # 임베딩 모델(KURE-v1 ~2GB) 캐시 — 컨테이너를 다시 만들어도 재다운로드하지 않는다.
      # docker compose down -v 로 볼륨을 지우거나 모델 revision 이 바뀌면 다시 받는다.
      - hf-cache:/models
    # DB는 Supabase(외부 관리형). Supabase 없이 로컬에서 돌리려면 아래 db 서비스 주석을 풀고
    # backend/.env 의 APP_DB_URL 을 postgresql+psycopg://app:app@db:5432/app 로 설정하세요.
    depends_on:
      - ocr-worker
    #   - db

  ocr-worker:
    build: ./ocr-worker
    ports:
      - "8100:8100"
    env_file:
      - ./ocr-worker/.env
    volumes:
      - hf-cache:/models

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # --- Supabase 없이 로컬 Postgres+pgvector 로 개발할 때만 사용 (기본 비활성) ---
  # db:
  #   image: pgvector/pgvector:pg16
  #   environment:
  #     POSTGRES_USER: app
  #     POSTGRES_PASSWORD: app
  #     POSTGRES_DB: app
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  hf-cache:
#   pgdata:
