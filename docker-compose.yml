# 선택 실행 경로 — 평소 개발은 uv/npm 직접 실행이 더 빠릅니다.
# 환경 통일·온보딩·배포용으로 `docker compose up --build` 사용.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # OCR_WORKER_URL 은 backend/.env 가 정합니다 — 여기서 덮어쓰지 마세요.
    #   외부 GPU(RunPod 등)  : https://<POD_ID>-8100.proxy.runpod.net  ← 기본 사용 형태
    #   아래 local-ocr 프로필: http://ocr-worker:8100
    # 예전에는 여기서 http://ocr-worker:8100 으로 고정했는데, 그러면 .env 를 RunPod 으로
    # 맞춰 둬도 compose 로 띄우는 순간 조용히 로컬 워커를 보게 됩니다.
    volumes:
      # 임베딩 모델(KURE-v1 ~2GB) 캐시 — 컨테이너를 다시 만들어도 재다운로드하지 않는다.
      # docker compose down -v 로 볼륨을 지우거나 모델 revision 이 바뀌면 다시 받는다.
      - hf-cache:/models
    # ocr-worker 에 depends_on 을 걸지 않습니다. 기본 형태(RunPod)에서는 그 서비스가 아예
    # 뜨지 않고, 워커 장애는 이미 503 으로 처리됩니다(services/document_processing/client.py).
    # DB는 Supabase(외부 관리형). backend/.env 의 APP_DB_URL 은 Supabase Transaction pooler
    # URI(:6543)여야 합니다 — Session pooler(:5432)는 클라이언트 수가 제한돼 EMAXCONNSESSION 이 납니다.
    # 컨테이너 하나가 잡는 커넥션은 기본 7개(Dockerfile CMD 는 worker 1개). 스케일아웃 시
    # (replica × 7) 이 Supabase Max Pooler Clients 를 넘지 않는지 확인하세요.
    #
    # Supabase 없이 로컬에서 돌리려면 아래 db 서비스 주석을 풀고
    # backend/.env 의 APP_DB_URL 을 postgresql+psycopg://app:app@db:5432/app 로 설정하세요
    # (로컬 Postgres 의 5432 는 pooler 와 무관하며 정상입니다).
    # depends_on:
    #   - db

  # OCR 워커를 이 호스트에서 함께 돌릴 때만 사용합니다. 기본은 RunPod 등 외부 GPU 라
  # 뜨지 않습니다 — 이미지가 10GB 에 가까워 그냥 두면 빌드만으로 디스크를 크게 먹습니다.
  #
  #   docker compose --profile local-ocr up --build
  #
  # 이때는 backend/.env 의 OCR_WORKER_URL 을 http://ocr-worker:8100 으로 바꿔야 합니다.
  ocr-worker:
    profiles:
      - local-ocr
    build: ./ocr-worker
    ports:
      # 로컬 디버그용(curl http://localhost:8100/health). 백엔드는 내부 네트워크 이름으로 부릅니다.
      # 워커에는 인증이 없을 수 있으므로 배포 환경에서는 이 포트를 외부에 열지 마세요.
      - "8100:8100"
    env_file:
      - ./ocr-worker/.env
    environment:
      # .env 의 OCR_VL_MODEL_DIR 은 호스트에서 직접 실행할 때 쓰는 경로라 컨테이너 경로로 덮어씁니다.
      OCR_VL_MODEL_DIR: /models/paddleocr-vl-1.6
    volumes:
      # 미리 받아 둔 PaddleOCR-VL 스냅샷(1.8GB). 이미지에 굽지 않고 읽기 전용으로 마운트합니다.
      # OCR_PROVIDER=tesseract 로 쓸 때는 참조되지 않습니다.
      - ./ocr-worker/models:/models:ro
      # 런타임에 내려받는 모델 캐시. 읽기 전용인 /models 와 분리해야 쓰기가 실패하지 않습니다.
      - ocr-hf-cache:/cache
      - ocr-paddlex-cache:/root/.paddlex

  frontend:
    build:
      context: ./frontend
      args:
        # Vite 는 빌드 시점에 값을 번들에 굽습니다 — 컨테이너 환경변수로는 바꿀 수 없습니다.
        # supabase 두 값이 비면 frontend/src/config/env.ts 에서 인증이 비활성화되므로
        # 루트 .env 에 채워 두세요(.env.example 참고).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        # 선택 — 비면 위험 보고서의 위치 카드가 핀 대체 화면으로 뜬다.
        VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

  # --- Supabase 없이 로컬 Postgres+pgvector 로 개발할 때만 사용 (기본 비활성) ---
  # db:
  #   image: pgvector/pgvector:pg16
  #   environment:
  #     POSTGRES_USER: app
  #     POSTGRES_PASSWORD: app
  #     POSTGRES_DB: app
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  hf-cache:
  ocr-hf-cache:
  ocr-paddlex-cache:
#   pgdata:
